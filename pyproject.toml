[project]
name = "snipe-rugg"
version = "0.1.0"
description = "Real-time Solana wallet intelligence engine: wallet tracking, dev launch monitoring, and rugger pattern analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "websockets>=13.1",
    "httpx>=0.27",
    "orjson>=3.10",
    "redis>=5.1",
]

[project.optional-dependencies]
# Pulled in by later phases (spec section 6) — not required for the Phase 1 real-time core.
discord = ["discord.py>=2.4"]
db = ["sqlalchemy[asyncio]>=2.0", "asyncpg>=0.30"]
dashboard = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
analysis = ["networkx>=3.4", "numpy>=2.1", "pandas>=2.2"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snipe_rugg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
